<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dots & Boxes - Online</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent-a: #3b82f6;
      --accent-b: #0bbd14;
      --line: #64748b;
      --dot: #e2e8f0;
      --text: #f1f5f9;
      --dot-size: 10px;
      --line-thick: 6px;
      --cell: 34px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; letter-spacing: -0.5px; }
    .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
    .lobby, .game { width: 100%; max-width: 520px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .scores {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .score-box {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.15rem;
    }
    #btnLeave{
      background: rgb(255, 38, 38);
      color: white;
    }
    .score-a { background: rgba(59,130,246,0.2); border: 2px solid var(--accent-a); color: var(--accent-a); }
    .score-b { background: rgba(80, 255, 88, 0.2); border: 2px solid var(--accent-b); color: var(--accent-b); }
    .turn {
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .turn.a { color: var(--accent-a); }
    .turn.b { color: var(--accent-b); }
    #board {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto 16px;
      user-select: none;
      touch-action: none;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot {
      width: var(--dot-size);
      height: var(--dot-size);
      background: var(--dot);
      border-radius: 50%;
      z-index: 2;
      flex-shrink: 0;
    }
    .hline, .vline {
      background: transparent;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .hline {
      height: var(--line-thick);
      width: var(--cell);
    }
    .vline {
      width: var(--line-thick);
      height: var(--cell);
      margin-left: calc((var(--dot-size) - var(--line-thick)) / 2);
      margin-right: calc((var(--dot-size) - var(--line-thick)) / 2);
    }
    .hline:hover:not(.drawn), .vline:hover:not(.drawn) {
      background: rgba(148,163,184,0.5);
    }
    .hline.drawn, .vline.drawn {
      background: var(--line);
      cursor: default;
    }
    .hline.drawn.a, .vline.drawn.a { background: var(--accent-a); }
    .hline.drawn.b, .vline.drawn.b { background: var(--accent-b); }
    .box {
      width: var(--cell);
      height: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      border-radius: 3px;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .box.a { background: rgba(59,130,246,0.35); color: var(--accent-a); }
    .box.b { background: rgba(80, 255, 88, 0.2); color: var(--accent-b); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    button {
      background: #334155;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #475569; }
    button.primary { background: var(--accent-a); }
    button.primary:hover { background: #2563eb; }
    button.danger { background: var(--accent-b); }
    input {
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 1rem;
      width: 160px;
      text-align: center;
    }
    input#joinCode { letter-spacing: 2px; width: 120px; }
    .room-info { text-align: center; margin: 12px 0; color: #94a3b8; font-size: 0.9rem; }
    .room-code { font-size: 1.6rem; font-weight: 700; letter-spacing: 4px; color: #fbbf24; }
    .status { text-align: center; margin-top: 10px; min-height: 24px; color: #94a3b8; }
    .winner {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      margin: 16px 0;
      padding: 12px;
      border-radius: 12px;
      background: rgba(251,191,36,0.15);
      color: #fbbf24;
    }
    .hidden { display: none !important; }
    .name-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .name-preview {
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
    }
    /* ===== CHAT UI ===== */
    .chat-area {
      margin-top: 16px;
      width: 100%;
    }
    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      max-height: 160px;
      overflow: hidden;
      margin-bottom: 8px;
      pointer-events: none;
    }
    .chat-bubble {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.9rem;
      line-height: 1.35;
      animation: chatIn 0.2s ease-out;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chat-bubble .chat-from {
      font-weight: 700;
      margin-right: 2px;
    }
    .chat-bubble.from-a .chat-from { color: var(--accent-a); }
    .chat-bubble.from-b .chat-from { color: var(--accent-b); }
    .chat-bubble .chat-sticker {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
      vertical-align: middle;
    }
    .chat-bubble.fading {
      animation: chatOut 0.4s ease-in forwards;
    }
    @keyframes chatIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes chatOut {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-6px); }
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input-row input#chatInput {
      flex: 1;
      width: auto;
      text-align: left;
      padding: 10px 12px;
    }
    .chat-input-row button {
      padding: 10px 14px;
      flex-shrink: 0;
    }
    /* Sticker bar */
    .sticker-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
      padding: 6px 0;
    }
    .sticker-btn {
      width: 42px;
      height: 42px;
      padding: 2px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      cursor: pointer;
      transition: transform 0.12s, background 0.12s;
      overflow: hidden;
    }
    .sticker-btn:hover {
      background: #334155;
      transform: scale(1.12);
    }
    .sticker-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    @media (max-width: 480px) {
      :root {
        --dot-size: 8px;
        --line-thick: 5px;
        --cell: 26px;
      }
      .box { font-size: 0.75rem; }
      .sticker-btn { width: 36px; height: 36px; }
      .chat-bubble .chat-sticker { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <h1>Dots & Boxes</h1>
  <p class="subtitle">8×8 dots · 2 players · Online multiplayer</p>

  <!-- LOBBY -->
  <div id="lobby" class="lobby card">
    <div class="name-row">
      <input id="playerName" placeholder="Your Name" maxlength="20" />
    </div>
    <div class="name-preview" id="namePreview">Symbol will appear here</div>

    <div style="text-align:center; margin: 20px 0 16px;">
      <button class="primary" id="btnCreate">Create Room</button>
    </div>
    <div style="display:flex; gap:10px; justify-content:center; align-items:center;">
      <input id="joinCode" placeholder="ROOM CODE" maxlength="6" />
      <button id="btnJoin">Join</button>
    </div>
    <div class="status" id="lobbyStatus"></div>
    <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:#64748b;">
      Share the room code with a friend.<br>
      Your symbol = first + last letter of your name (Saad → Sd)
    </p>
  </div>

  <!-- GAME -->
  <div id="game" class="game hidden">
    <div class="scores">
      <div class="score-box score-a">
        <div id="nameA">Player A</div>
        <div style="font-size:1.5rem; margin-top:4px;"><span id="scoreA">0</span></div>
      </div>
      <div class="score-box score-b">
        <div id="nameB">Player B</div>
        <div style="font-size:1.5rem; margin-top:4px;"><span id="scoreB">0</span></div>
      </div>
    </div>
    <div class="turn" id="turnInfo">Player A's turn</div>
    <div id="board"></div>
    <div class="room-info">
      Room: <span class="room-code" id="roomCodeDisplay"></span>
      <span id="youAre"></span>
    </div>
    <div class="status" id="gameStatus"></div>
    <div id="winnerMsg" class="winner hidden"></div>
    <div class="controls">
      <button id="btnNewGame">New Game</button>
      <button class="danger" id="btnLeave">Leave Room</button>
    </div>

    <!-- CHAT: bottom of game, does not interrupt play -->
    <div class="chat-area">
      <div class="chat-messages" id="chatMessages"></div>

      <!-- Sticker bar -->
      <div class="sticker-bar" id="stickerBar">
        <!-- buttons injected by JS -->
      </div>

      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="Type a message..." maxlength="120" autocomplete="off" />
        <button id="btnSendChat">Send</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // ============== CONFIG ==============
    const RENDER_SERVER_URL = 'https://boxgame-0f7l.onrender.com';  // ← PASTE YOUR RENDER URL HERE

    const SERVER_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3001'
      : RENDER_SERVER_URL;

    const DOTS = 8;
    const BOXES = DOTS - 1;

    // Available stickers (files must be in public/stickers/ on the server)
    const STICKERS = [
      { id: 'angryCat',       file: 'angryCat.png',       label: 'Angry' },
      { id: 'CritizismCat',   file: 'CritizismCat.png',   label: 'Criticism' },
      { id: 'thugCat',        file: 'thugCat.png',        label: 'Thug' },
      { id: 'flabbergastedCat', file: 'flabbergastedCat.png', label: 'Flabbergasted' },
      { id: 'pardonCat',      file: 'pardonCat.png',      label: 'Pardon' },
      { id: 'xudGayaCat',     file: 'xudGayaCat.png',     label: 'Xud Gaya' },
      { id: 'belugaCat',      file: 'belugaCat.png',      label: 'Beluga' }
    ];

    // Always load stickers from the same host as the Socket.IO server
    // (important when HTML is opened from a different origin than Render)
    function stickerUrl(file) {
      return SERVER_URL + '/stickers/' + file;
    }

    // ============== STATE ==============
    let socket = null;
    let roomId = null;
    let myPlayer = null;       // 'A' or 'B'
    let myName = '';
    let mySymbol = '';
    let playerNames = { A: 'Player A', B: 'Player B' };
    let playerSymbols = { A: 'A', B: 'B' };
    let currentTurn = 'A';
    let scores = { A: 0, B: 0 };
    let hLines = [];
    let vLines = [];
    let boxes = [];            // stores the SYMBOL (e.g. "Sd")
    let gameOver = false;

    // ============== HELPERS ==============
    function getSymbol(name) {
      const clean = (name || '').trim().replace(/\s+/g, '');
      if (clean.length === 0) return '??';
      if (clean.length === 1) return clean[0].toUpperCase() + clean[0].toUpperCase();
      return (clean[0] + clean[clean.length - 1]).toUpperCase();
    }

    // Live preview of symbol while typing name
    document.getElementById('playerName').addEventListener('input', (e) => {
      const sym = getSymbol(e.target.value);
      document.getElementById('namePreview').textContent =
        e.target.value.trim() ? `Your symbol: ${sym}` : 'Symbol will appear here';
    });

    function initBoardData() {
      hLines = Array.from({ length: DOTS }, () => Array(BOXES).fill(null));
      vLines = Array.from({ length: BOXES }, () => Array(DOTS).fill(null));
      boxes = Array.from({ length: BOXES }, () => Array(BOXES).fill(null));
      scores = { A: 0, B: 0 };
      currentTurn = 'A';
      gameOver = false;
    }

    // ============== RENDER BOARD ==============
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      for (let r = 0; r < DOTS; r++) {
        const hRow = document.createElement('div');
        hRow.className = 'row';
        for (let c = 0; c < DOTS; c++) {
          const dot = document.createElement('div');
          dot.className = 'dot';
          hRow.appendChild(dot);
          if (c < BOXES) {
            const line = document.createElement('div');
            line.className = 'hline';
            if (hLines[r][c]) {
              line.classList.add('drawn', hLines[r][c].toLowerCase());
            } else {
              line.dataset.type = 'h';
              line.dataset.r = r;
              line.dataset.c = c;
              line.addEventListener('click', onLineClick);
            }
            hRow.appendChild(line);
          }
        }
        board.appendChild(hRow);

        if (r < BOXES) {
          const vRow = document.createElement('div');
          vRow.className = 'row';
          for (let c = 0; c < DOTS; c++) {
            const line = document.createElement('div');
            line.className = 'vline';
            if (vLines[r][c]) {
              line.classList.add('drawn', vLines[r][c].toLowerCase());
            } else {
              line.dataset.type = 'v';
              line.dataset.r = r;
              line.dataset.c = c;
              line.addEventListener('click', onLineClick);
            }
            vRow.appendChild(line);

            if (c < BOXES) {
              const box = document.createElement('div');
              box.className = 'box';
              if (boxes[r][c]) {
                const owner = boxes[r][c] === playerSymbols.A ? 'a' : 'b';
                box.classList.add(owner);
                box.textContent = boxes[r][c];
              }
              vRow.appendChild(box);
            }
          }
          board.appendChild(vRow);
        }
      }
      updateUI();
    }

    function updateUI() {
      document.getElementById('scoreA').textContent = scores.A;
      document.getElementById('scoreB').textContent = scores.B;
      document.getElementById('nameA').textContent = `${playerNames.A} (${playerSymbols.A})`;
      document.getElementById('nameB').textContent = `${playerNames.B} (${playerSymbols.B})`;

      const turnEl = document.getElementById('turnInfo');
      if (gameOver) {
        turnEl.textContent = 'Game Over';
        turnEl.className = 'turn';
      } else {
        const name = playerNames[currentTurn] || currentTurn;
        turnEl.textContent = `${name}'s turn`;
        turnEl.className = 'turn ' + currentTurn.toLowerCase();
      }
      document.getElementById('youAre').textContent =
        myPlayer ? ` · You are ${playerNames[myPlayer]} (${playerSymbols[myPlayer]})` : '';
    }

    function onLineClick(e) {
      if (!myPlayer || currentTurn !== myPlayer || gameOver) return;
      const type = e.target.dataset.type;
      const r = +e.target.dataset.r;
      const c = +e.target.dataset.c;
      socket.emit('move', { roomId, type, r, c });
    }

    function showWinner() {
      const msg = document.getElementById('winnerMsg');
      msg.classList.remove('hidden');
      if (scores.A > scores.B) {
        msg.textContent = `${playerNames.A} Wins! 🎉`;
      } else if (scores.B > scores.A) {
        msg.textContent = `${playerNames.B} Wins! 🎉`;
      } else {
        msg.textContent = "It's a Draw!";
      }
    }

    // ============== CHAT + STICKERS ==============
    const CHAT_DURATION_MS = 5000;

    function addChatMessage(fromName, fromPlayer, text, stickerId) {
      const container = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble from-' + (fromPlayer || '').toLowerCase();

      const nameSpan = document.createElement('span');
      nameSpan.className = 'chat-from';
      nameSpan.textContent = fromName + ':';
      bubble.appendChild(nameSpan);

      if (stickerId) {
        const sticker = STICKERS.find(s => s.id === stickerId);
        if (sticker) {
          const img = document.createElement('img');
          img.className = 'chat-sticker';
          img.src = stickerUrl(sticker.file);
          img.alt = sticker.label;
          img.title = sticker.label;
          bubble.appendChild(img);
        }
      }

      if (text) {
        const textNode = document.createTextNode(' ' + text);
        bubble.appendChild(textNode);
      }

      container.appendChild(bubble);

      // Keep only a reasonable number of stacked bubbles
      while (container.children.length > 6) {
        container.removeChild(container.firstChild);
      }

      // Auto-remove after 5 seconds with fade-out
      setTimeout(() => {
        bubble.classList.add('fading');
        setTimeout(() => {
          if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
        }, 400);
      }, CHAT_DURATION_MS);
    }

    function sendChat(stickerId = null) {
      if (!socket || !roomId || !myPlayer) return;
      const input = document.getElementById('chatInput');
      const text = (input.value || '').trim();

      // Allow sending sticker alone or text alone or both
      if (!text && !stickerId) return;

      socket.emit('chat', {
        roomId,
        text: text || '',
        sticker: stickerId || null
      });

      input.value = '';
      input.focus();
    }

    function buildStickerBar() {
      const bar = document.getElementById('stickerBar');
      bar.innerHTML = '';
      STICKERS.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'sticker-btn';
        btn.title = s.label;
        btn.type = 'button';
        const img = document.createElement('img');
        img.src = stickerUrl(s.file);
        img.alt = s.label;
        btn.appendChild(img);
        btn.addEventListener('click', () => sendChat(s.id));
        bar.appendChild(btn);
      });
    }

    document.getElementById('btnSendChat').onclick = () => sendChat();
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendChat();
      }
    });

    // ============== SOCKET ==============
    function connectSocket() {
      socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        document.getElementById('lobbyStatus').textContent = 'Connected to server';
      });

      socket.on('connect_error', () => {
        document.getElementById('lobbyStatus').textContent =
          'Cannot reach server. (Render free tier may take 30-50s to wake up — wait and try again)';
      });

      socket.on('roomCreated', ({ roomId: id, player, name, symbol }) => {
        roomId = id;
        myPlayer = player;
        myName = name;
        mySymbol = symbol;
        playerNames[player] = name;
        playerSymbols[player] = symbol;
        enterGame();
      });

      socket.on('roomJoined', ({ roomId: id, player, name, symbol }) => {
        roomId = id;
        myPlayer = player;
        myName = name;
        mySymbol = symbol;
        playerNames[player] = name;
        playerSymbols[player] = symbol;
        enterGame();
      });

      socket.on('startGame', (state) => {
        applyFullState(state);
        document.getElementById('gameStatus').textContent = 'Game started!';
      });

      socket.on('moveMade', (data) => {
        applyFullState(data);
      });

      socket.on('chatMessage', ({ fromName, fromPlayer, text, sticker }) => {
        addChatMessage(fromName, fromPlayer, text, sticker);
      });

      socket.on('error', (msg) => {
        document.getElementById('lobbyStatus').textContent = msg;
        document.getElementById('gameStatus').textContent = msg;
      });

      socket.on('opponentLeft', () => {
        document.getElementById('gameStatus').textContent = 'Opponent left the room';
      });
    }

    function applyFullState(state) {
      if (state.hLines) hLines = state.hLines;
      if (state.vLines) vLines = state.vLines;
      if (state.boxes) boxes = state.boxes;
      if (state.scores) scores = state.scores;
      if (state.currentTurn) currentTurn = state.currentTurn;
      if (typeof state.gameOver === 'boolean') gameOver = state.gameOver;
      if (state.playerNames) playerNames = state.playerNames;
      if (state.playerSymbols) playerSymbols = state.playerSymbols;
      renderBoard();
      if (gameOver) showWinner();
      else document.getElementById('winnerMsg').classList.add('hidden');
    }

    function enterGame() {
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('roomCodeDisplay').textContent = roomId;
      initBoardData();
      renderBoard();
      document.getElementById('chatMessages').innerHTML = '';
      buildStickerBar();   // show stickers when entering game
    }

    function getName() {
      const name = document.getElementById('playerName').value.trim();
      if (!name) {
        document.getElementById('lobbyStatus').textContent = 'Please enter your name first';
        return null;
      }
      return name;
    }

    // ============== UI EVENTS ==============
    document.getElementById('btnCreate').onclick = () => {
      const name = getName();
      if (!name) return;

      if (!socket || !socket.connected) {
        document.getElementById('lobbyStatus').textContent = 'Connecting...';
        connectSocket();
        setTimeout(() => socket.emit('createRoom', { name }), 600);
      } else {
        socket.emit('createRoom', { name });
      }
    };

    document.getElementById('btnJoin').onclick = () => {
      const name = getName();
      if (!name) return;
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      if (!code) {
        document.getElementById('lobbyStatus').textContent = 'Enter a room code';
        return;
      }

      if (!socket || !socket.connected) {
        document.getElementById('lobbyStatus').textContent = 'Connecting...';
        connectSocket();
        setTimeout(() => socket.emit('joinRoom', { code, name }), 600);
      } else {
        socket.emit('joinRoom', { code, name });
      }
    };

    document.getElementById('btnNewGame').onclick = () => {
      if (socket && roomId) socket.emit('newGame', roomId);
    };

    document.getElementById('btnLeave').onclick = () => {
      if (socket) socket.emit('leaveRoom', roomId);
      roomId = null;
      myPlayer = null;
      document.getElementById('game').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
      document.getElementById('winnerMsg').classList.add('hidden');
      document.getElementById('chatMessages').innerHTML = '';
    };

    // Auto connect
    connectSocket();
  </script>
</body>
</html>
